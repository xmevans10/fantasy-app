name: team-puzzle-inventory
on:
  schedule:
    - cron: '25 10 * * 2'
  workflow_dispatch:
concurrency:
  group: team-puzzle-inventory
  cancel-in-progress: false
jobs:
  saints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m pytest tools/ingest/tests/test_team_puzzles.py -q
      - name: Validate shared inventory and publish distinct additions
        run: |
          for attempt in 1 2 3; do
            python -m tools.ingest.team_puzzles --output team-inventory-report.json --publish && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-inventory-report
          path: team-inventory-report.json
