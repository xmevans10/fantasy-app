name: ingest-puzzles

on:
  schedule:
    - cron: "0 9 * * *"     # daily 09:00 UTC — keep the puzzle pool fresh
  push:
    paths:
      - "tools/ingest/**"
      - ".github/workflows/ingest.yml"
  workflow_dispatch:        # allow manual + on-demand backfill

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m pytest tools/ingest/tests -q

  ingest:
    needs: test
    runs-on: ubuntu-latest
    # Only push real data to Supabase on schedule / manual runs, not every PR push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Persist the provider HTTP cache across daily runs. The MLB pool is hundreds of
      # players; year-by-year career lines are cached for a week (see mlb_stats), so a
      # restored cache lets the daily ingest skip re-pulling the whole pool. The unique
      # per-run key always saves a fresh snapshot; `restore-keys` loads the most recent
      # prior cache, and the code-side 7-day TTL refetches anything gone stale.
      - uses: actions/cache@v4
        with:
          path: tools/ingest/.cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: |
            ingest-cache-
      - run: python -m tools.ingest.main --backfill 30 --upsert --catalog
      # Mint today's Grid puzzles (sports without a viable board skip themselves). NFL answer
      # pools are widened to full rosters (nfl_rosters.py); previously grids were only minted
      # by hand, so the daily active_date row often didn't exist and clients fell back to the
      # modulo pick over stale rows.
      #
      # ⚠️ PAUSED 2026-07-27 — RE-ENABLE WHEN 1.2 BUILD 15 IS APPROVED. ⚠️
      # `main` now carries the v2 Grid generator, which emits non-classic archetypes
      # (teams-x-teams, mixed-x-teams, ...). Those have NO legacy rowTeams/colDecades fallback,
      # so the shipped App Store client (1.2 build 14) decodes them as "No Grid today" — and a
      # minted board is immutable for its day, so there is no undo. Build 15 is the client that
      # can read them; it was submitted 2026-07-27 13:26 UTC and is still WAITING_FOR_REVIEW.
      # This cron would otherwise have pushed v2 boards to live users at the next 09:00 UTC run.
      # See docs/BALLIQ_SPEC.md §9.2 and docs/grid-axes-research.md §9 (Gate 0).
      #
      # To re-enable: delete this comment block and uncomment the line below. `baseball` is
      # added deliberately — it was missing, which is the whole reason baseball has exactly one
      # Grid board ever minted (2026-07-08) while the other four sports get dailies, despite
      # baseball having the richest team-pair space of any sport (all 435 of its C(30,2) club
      # pairs share 5+ players; verified against live data 2026-07-27).
      # - run: python -m tools.ingest.main --grid nfl nba baseball soccer tennis --upsert
