name: ingest-puzzles

on:
  schedule:
    - cron: "0 9 * * *"     # daily 09:00 UTC — keep the puzzle pool fresh
  push:
    paths:
      - "tools/ingest/**"
      - ".github/workflows/ingest.yml"
  workflow_dispatch:        # allow manual + on-demand backfill

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m pytest tools/ingest/tests -q

  ingest:
    needs: test
    runs-on: ubuntu-latest
    # Only push real data to Supabase on schedule / manual runs, not every PR push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Persist the provider HTTP cache across daily runs. The MLB pool is hundreds of
      # players; year-by-year career lines are cached for a week (see mlb_stats), so a
      # restored cache lets the daily ingest skip re-pulling the whole pool. The unique
      # per-run key always saves a fresh snapshot; `restore-keys` loads the most recent
      # prior cache, and the code-side 7-day TTL refetches anything gone stale.
      - uses: actions/cache@v4
        with:
          path: tools/ingest/.cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: |
            ingest-cache-
      - run: python -m tools.ingest.main --backfill 30 --upsert --catalog
      # Mint today's Grid puzzles (sports without a viable board skip themselves). NFL answer
      # pools are widened to full rosters (nfl_rosters.py); previously grids were only minted
      # by hand, so the daily active_date row often didn't exist and clients fell back to the
      # modulo pick over stale rows.
      #
      # Re-enabled 2026-07-31: 1.3 build 21 (which carries the v2 Grid decoder that shipped in
      # build 15) is READY_FOR_SALE, confirmed live via the ASC API — the v2-content gate in
      # docs/BALLIQ_SPEC.md §9.2 is clear. `baseball` is included deliberately — it was missing
      # before the pause, which is the whole reason baseball had only 1 Grid board ever minted
      # (2026-07-08) while the other four sports get dailies, despite baseball having the
      # richest team-pair space of any sport (all 435 of its C(30,2) club pairs share 5+
      # players; verified against live data 2026-07-27).
      # `--grid-days` is left at its default of 2 (today + tomorrow) — the client keys the daily
      # Grid to the device-LOCAL date, so tomorrow's board must exist before UTC+14 reaches its
      # midnight (10:00 UTC today). Don't raise it — see daily-puzzle.yml's cron comment on why
      # extra lookahead is unreleased content visible to any client without a future-row filter.
      #
      # `if: always()` because the Grid must not be hostage to the step above. Production
      # 2026-08-30: `ingest-puzzles` failed three days running on a statement timeout in the
      # catalog step's missing-headshot scan, this step never ran, and The Grid -- a Pro-only
      # format -- had no board for two days. Every client fell back to a modulo pick over the
      # archive with no TODAY badge. daily-puzzle.yml already runs its three format steps this
      # way, for exactly this reason; this job never got the same treatment.
      - if: always()
        run: python -m tools.ingest.main --grid nfl nba baseball soccer tennis --upsert
      # Re-warm the `grid_membership_index` cache (0014_grid_membership_index_cache.sql) right
      # after minting, so "New random grid" never pays the ~10s live-aggregate cost this masked
      # before: the cache is read on a 36h TTL, and a stale/missing row falls back to computing
      # inline on whichever player's request loses that race. Cheap and idempotent — a no-op
      # rebuild if nothing changed since yesterday's run.
      - if: always()
        run: |
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/refresh_grid_membership_index_cache" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      # Repoint already-minted Keep4/Journeyman boards (0015_repoint_puzzle_headshots.sql)
      # whenever the catalog step above improved a player's headshot but that player already
      # sits in a frozen board — the daily `--upsert --catalog` only fixes NEW rows, an existing
      # board's frozen content never sees it otherwise. Cheap and idempotent: a no-op update on
      # any day nothing changed.
      - if: always()
        run: |
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/repoint_puzzle_headshots" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
