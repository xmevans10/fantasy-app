name: x-reply

# Reply targeting: every 15 minutes, find *rising* posts worth replying to and write briefs
# (tools/marketing/x_replies.py). Ranks by reach-per-sibling × freshness, skips anything that
# risks the algorithm's heavy negative weights, and produces briefs — not posts — because
# deterministic copy is not hip. This job posts nothing; a human or an LLM drafts from the briefs.
#
# Dark by default: scheduled runs only fire when repo variable X_REPLIES is 'true'.

# COST: X bills per post read (~$0.0052). 16 accounts x 5 posts every 15 min would be ~$40/day.
# Hence every 2 hours, 3 targets, and a hard --max-reads budget. Raise deliberately, not by default.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Only posts younger than this many minutes"
        required: false
        default: "150"
      cap:
        description: "Max targets per run"
        required: false
        default: "3"
      max_reads:
        description: "Hard stop after N posts read"
        required: false
        default: "120"

jobs:
  briefs:
    if: github.event_name == 'workflow_dispatch' || vars.X_REPLIES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find reply targets
        run: |
          {
            echo "# Reply targets"
            echo
            echo '```'
            python -m tools.marketing.x_replies --draft \
              --minutes "${{ github.event.inputs.minutes || '150' }}" \
              --cap "${{ github.event.inputs.cap || '3' }}" \
              --max-reads "${{ github.event.inputs.max_reads || '120' }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
