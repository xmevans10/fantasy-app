name: daily-puzzle

on:
  schedule:
    # 00:00 UTC daily (fires ~03:00-04:00 with GitHub cron drift). Each run mints TODAY +
    # TOMORROW (idempotent per (date, sport), so in steady state only the newest day is
    # actually new). The one day of lookahead is load-bearing, not padding: the client keys
    # the daily to the DEVICE-LOCAL calendar date (a fresh puzzle at the user's own midnight),
    # and the earliest timezone (UTC+14) reaches tomorrow's local midnight at 10:00 UTC today
    # — ~6h after this run, so tomorrow's row must already exist by then. It is also what lets
    # a client serve the new day's puzzle straight from yesterday's disk cache at the midnight
    # flip, even offline.
    #
    # Deliberately ONE day, not two, even though a second would survive a fully missed run:
    # every minted-ahead row is visible to any client that reads the whole pool, and App Store
    # builds up to and including 1.3/16 have no future-row filter (that ships with the
    # local-midnight client) — so each extra day is another day of unreleased content sitting
    # in their Pro archive, playable before it drops. One day is the minimum the timezone
    # deadline allows; raise to 2-3 for missed-run insurance only once the filtering client
    # is the floor in the wild.
    - cron: "0 0 * * *"
  workflow_dispatch:        # allow manual runs, optionally backfilling many days at once —
                            # the live provider pull (~25-30min) is the same regardless of
                            # count, so minting N days in one dispatched run is far cheaper
                            # than N separate runs.
    inputs:
      count:
        description: "How many consecutive days to mint (starting at start-date, or today)"
        required: false
        default: "2"
      start_date:
        description: "First date to mint, YYYY-MM-DD (blank = today)"
        required: false
        default: ""

jobs:
  mint:
    runs-on: ubuntu-latest
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same cache as ingest.yml — daily_puzzle.py pulls the same live provider data
      # (gather_seasons), so a warm cache avoids re-fetching everything from scratch.
      - uses: actions/cache@v4
        with:
          path: tools/ingest/.cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: |
            ingest-cache-
      - run: pip install -r tools/ingest/requirements.txt
      # `|| '2'` covers scheduled runs (no inputs): today + tomorrow — see the cron comment
      # above for why one day of lookahead is both required and (for now) the maximum.
      - run: |
          python -m tools.ingest.daily_puzzle --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
      # The Who Am I? daily mint (least-recently-served per sport — see daily_whoami.py).
      # No provider pull, runs in seconds; kept as its own step so a keep4 exhaustion
      # failure above doesn't also lose the day's whoami picks (and vice versa).
      - if: always()
        run: |
          python -m tools.ingest.daily_whoami --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
      # Journeyman's daily mint (M22) — same least-recently-served rotation and the same
      # seconds-not-minutes cost as the Who Am I? step above, and its own step for the same
      # reason: one format running out of pool must not cost the other two their picks.
      - if: always()
        run: |
          python -m tools.ingest.daily_journeyman --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
