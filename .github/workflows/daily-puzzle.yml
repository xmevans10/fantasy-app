name: daily-puzzle

on:
  schedule:
    # 00:00 UTC daily (fires ~03:00-04:00 with GitHub cron drift). Each run mints TODAY +
    # TOMORROW (idempotent per (date, sport), so in steady state only the newest day is
    # actually new). The one day of lookahead is load-bearing, not padding: the client keys
    # the daily to the DEVICE-LOCAL calendar date (a fresh puzzle at the user's own midnight),
    # and the earliest timezone (UTC+14) reaches tomorrow's local midnight at 10:00 UTC today
    # — ~6h after this run, so tomorrow's row must already exist by then. It is also what lets
    # a client serve the new day's puzzle straight from yesterday's disk cache at the midnight
    # flip, even offline.
    #
    # Deliberately ONE day, not two, even though a second would survive a fully missed run:
    # every minted-ahead row is visible to any client that reads the whole pool, and App Store
    # builds up to and including 1.3/16 have no future-row filter (that ships with the
    # local-midnight client) — so each extra day is another day of unreleased content sitting
    # in their Pro archive, playable before it drops. One day is the minimum the timezone
    # deadline allows; raise to 2-3 for missed-run insurance only once the filtering client
    # is the floor in the wild.
    - cron: "0 0 * * *"
  workflow_dispatch:        # allow manual runs, optionally backfilling many days at once —
                            # the live provider pull (~25-30min) is the same regardless of
                            # count, so minting N days in one dispatched run is far cheaper
                            # than N separate runs.
    inputs:
      count:
        description: "How many consecutive days to mint (starting at start-date, or today)"
        required: false
        default: "2"
      start_date:
        description: "First date to mint, YYYY-MM-DD (blank = today)"
        required: false
        default: ""

jobs:
  mint:
    runs-on: ubuntu-latest
    # `issues: write` is for the X-assets notification comment only; nothing else here writes
    # to the repo, and listing it explicitly narrows the token to exactly these two scopes.
    permissions:
      contents: read
      issues: write
    # Without this the job inherits GitHub's 6-HOUR default, so a single provider hanging on
    # a socket burns six hours of CI and — because the Who Am I? and Journeyman steps run
    # after the Keep4 one — delays or loses two mints that had nothing wrong with them.
    #
    # Sized from real run history rather than guessed: the last 12 scheduled runs took 2-12
    # minutes each, with two genuine outliers at 51 and 53 minutes (a cold provider cache
    # after a weekly refresh). 90 leaves headroom over the worst real run while still
    # catching a true hang in a useful timeframe.
    timeout-minutes: 90
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same cache as ingest.yml — daily_puzzle.py pulls the same live provider data
      # (gather_seasons), so a warm cache avoids re-fetching everything from scratch.
      - uses: actions/cache@v4
        with:
          path: tools/ingest/.cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: |
            ingest-cache-
      - run: pip install -r tools/ingest/requirements.txt
      # LIVE DEFECT FIX (Phase 0 of the fresh-drop work): this job restores the shared provider
      # cache and, until now, never evicted anything from it. The nflverse WEEKLY stats file
      # caches for 30 days (`nfl_nflverse_games.fetch_year`'s ttl_hours=24*30), and the only
      # thing that ever cleared it was weekly-refresh.yml's `--evict-current-season`, which
      # runs once a week. In season that meant the ordinary nightly NFL dailies could be minted
      # from a weekly file up to a month out of date, and nothing anywhere would have said so.
      #
      # Evicting only current/previous-year entries keeps every immutable historical file warm,
      # so this costs one refetch of the in-progress season rather than a cold cache.
      - run: python -m tools.ingest.main --evict-current-season --evict-only
      # `|| '2'` covers scheduled runs (no inputs): today + tomorrow — see the cron comment
      # above for why one day of lookahead is both required and (for now) the maximum.
      # The only step that does a full multi-sport provider pull, so it is the only one that
      # can hang for a long time. Bounded well above its real cost (see the job note) so the
      # two seconds-not-minutes mints below still get their turn.
      - timeout-minutes: 60
        run: |
          python -m tools.ingest.daily_puzzle --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
      # The Who Am I? daily mint (least-recently-served per sport — see daily_whoami.py).
      # No provider pull, runs in seconds; kept as its own step so a keep4 exhaustion
      # failure above doesn't also lose the day's whoami picks (and vice versa).
      - if: always()
        run: |
          python -m tools.ingest.daily_whoami --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
      # Journeyman's daily mint (M22) — same least-recently-served rotation and the same
      # seconds-not-minutes cost as the Who Am I? step above, and its own step for the same
      # reason: one format running out of pool must not cost the other two their picks.
      - if: always()
        run: |
          python -m tools.ingest.daily_journeyman --upsert \
            --count "${{ github.event.inputs.count || '2' }}" \
            ${{ github.event.inputs.start_date != '' && format('--date {0}', github.event.inputs.start_date) || '' }}
      # X post assets for today's boards and yesterday's answers (tools/marketing/x_assets.py).
      # Reads only what is already published and never posts anywhere. Find them in this run:
      # the step log prints every caption, the job summary shows the images inline, and the
      # `x-assets-daily` artifact holds the PNGs. A comment on the `x-assets` issue notifies the
      # owner. `continue-on-error` so marketing can never turn a successful mint red.
      - if: always()
        name: Render X post assets
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pillow
          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)
          python -m tools.marketing.x_assets --daily "$TODAY" --answers "$YESTERDAY" \
            --out build/x-assets --publish --summary "$GITHUB_STEP_SUMMARY" --notify \
            --title "X posts for $TODAY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-assets-daily
          path: build/x-assets
          if-no-files-found: ignore
          retention-days: 30
