name: headshot-backfill

# Closes the gap the headshot pipeline (tools/ingest/headshots.py, warm_cdn.py) has had since it
# was built: every stage — the sharded fetch/rehost worker, the ESPN/NBA/Wikimedia backfills,
# dupe detection, repoint, and transform-warming — was manual-CLI-only. `ingest.yml` only ever
# *applies* whatever the ledger already resolved (`apply_headshot_ledger`); it never fetches or
# rehosts anything new. So every day's freshly-discovered player sat on a raw external URL — a
# real placeholder about half the time for NFL/baseball (52%/63% of distinct sources, measured
# 2026-09-02) — until someone remembered to run this by hand.
#
# Every step here is already TARGETED, not a blind full rescan: `fetch` shards only claim
# `pending` ledger rows, and every `--*-backfill` flag only looks at `player_seasons.headshot=''`
# rows in the first place (see `_photoless_names` in headshots.py) — so re-running costs almost
# nothing once a sport's backlog is actually exhausted, the candidate queries just come back
# empty. That's what makes the self-chaining loop below viable: it isn't "run everything again,"
# it's "check what's still missing and go after just that."
#
# `converge` (last job) re-runs this whole workflow via workflow_dispatch as long as the last
# pass made real progress (fewer `pending`+`error` ledger rows than before it started) — so one
# trigger keeps going, pass after pass, until the pipeline plateaus (an unchanged remaining count
# means whatever's left needs a source this pipeline doesn't have, not another pass) or
# `iteration` hits `max_iterations`, whichever comes first. A schedule/manual trigger always
# starts fresh at iteration 1; only `converge`'s own self-dispatch increments it.
on:
  schedule:
    - cron: "0 11 * * 0"   # weekly, Sunday 11:00 UTC — after discover-players.yml's Sunday run
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards for the fetch/rehost pass"
        default: "8"
      iteration:
        description: "Convergence-loop bookkeeping — leave at 1 for a manual run"
        default: "1"
      max_iterations:
        description: "Safety cap on self-chained passes per trigger"
        default: "20"

permissions:
  contents: read
  # `converge` dispatches this same workflow again via the REST API — needs write on Actions,
  # not just the default read.
  actions: write

jobs:
  # Computed rather than a fixed 0-7 range so a manual `shards` input actually changes the matrix
  # size (job-level `if:` can't see `matrix`, so gating a fixed matrix by index doesn't work —
  # same reasoning grid-backfill.yml's `plan` job documents for its own matrix). Also snapshots
  # the "remaining unresolved" count BEFORE this pass touches anything, so `converge` can tell
  # whether the pass that just ran actually moved the needle.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.build.outputs.shards }}
      before_remaining: ${{ steps.before.outputs.remaining }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - id: build
        env:
          SHARDS: ${{ inputs.shards || '8' }}
        run: python3 -c "import json,os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"
      - id: before
        run: |
          summary=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/headshot_coverage_summary" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "### Coverage before this pass" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          remaining=$(echo "$summary" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(sum(v.get('pending', 0) + v.get('error', 0) for v in data.values()))
          ")
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

  # Reset last week's transient failures (Wikimedia/Transfermarkt throttling under load) so this
  # run retries them instead of leaving them stuck in `error` forever.
  reset-errors:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m tools.ingest.headshots --reset-errors

  # The bulk-coverage step: claim every `pending` source in `headshot_assets` and try to rehost
  # it. Sharded and run in parallel — `run()`'s own doc comment says shards never overlap (hash-
  # bucketed claims), same precedent as `grid-backfill.yml`'s matrix. `shards` is a plain input
  # rather than a computed matrix since it's just "how many of 0..N-1" — no windowing to plan.
  fetch:
    needs: [plan, reset-errors]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SHARD_TOTAL: ${{ inputs.shards || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m tools.ingest.headshots --shard ${{ matrix.shard }}/$SHARD_TOTAL

  # Targeted backfills for rows the generic fetch can't reach because they need a different
  # source entirely (the league CDN never had a real photo, or the row has no id to fetch by).
  backfill:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      # Each of these five steps is `if: always()` deliberately: they hit independent sources
      # and are not a pipeline (one's failure carries no information the next needs). Without
      # this, one step failing hard-stops the job and silently skips everything after it — which
      # is exactly what happened live 2026-09-03: `--espn-nfl-backfill` hit a transient 500
      # (fixed separately, `_rest` now retries 5xx) and took wiki-backfill/nba-backfill/
      # detect-dupes down with it for two convergence-loop iterations in a row.
      #
      # ESPN's archive recovers NFL rows the league CDN drops to a helmet stub on retirement
      # (2015+ near 100%, 2000-14 ~35%, per headshots.py's own measurement).
      - if: always()
        run: python -m tools.ingest.headshots --espn-nfl-backfill
      # MLB/NBA rows with no id bridge — resolves via ESPN search (exact-name-match only, so it
      # never risks the wrong face).
      - if: always()
        run: python -m tools.ingest.headshots --espn-search-backfill --sports baseball,nba
      # NBA rows still photo-less after the ESPN passes, via cdn.nba.com's person-id catalog.
      - if: always()
        run: python -m tools.ingest.headshots --nba-backfill
      # Sequential by design inside the script (not thread-pooled) to avoid Wikimedia's 429
      # throttle — 75% hit rate on baseball players MLB's CDN lacks, plus tennis/soccer/older
      # NBA-NFL coverage.
      - if: always()
        run: python -m tools.ingest.headshots --wiki-backfill
      # Catches stock/stub graphics the byte-floor check alone doesn't (e.g. the NFL helmet is a
      # normal-sized PNG) by flagging byte-identical sources repeated across many players.
      - if: always()
        run: python -m tools.ingest.headshots --detect-dupes

  # Apply everything the above resolved: rewrite player_seasons.headshot from the ledger, then
  # repoint already-minted puzzles (0015_repoint_puzzle_headshots.sql) — `--repoint` alone only
  # ever touches the catalog; a Keep4/Journeyman board frozen its own copy of the URL at mint
  # time and stays blank forever otherwise, which is what actually shipped a WR Keep4 board with
  # zero photos to a real user (2026-09-03). Then pre-render the 192px transform for every
  # newly-rehosted asset so no real user pays the ~1.9s cold-transform cost, and warm the
  # render-endpoint edge cache the app actually reads from (warm_cdn.py: 1.4-1.8s cold ->
  # 0.06-0.18s warm, measured 2026-08-28).
  finalize:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ingest/requirements.txt
      - run: python -m tools.ingest.headshots --repoint
      - name: Repoint already-minted puzzle content
        run: |
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/repoint_puzzle_headshots" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      - run: python -m tools.ingest.headshots --warm-transforms
      - run: python -m tools.ingest.warm_cdn --scope all

  # The convergence check. Re-scans coverage, compares to `plan`'s before-snapshot, and either
  # dispatches another full pass of this same workflow or stops and explains why.
  converge:
    needs: [plan, finalize]
    if: always()
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BEFORE: ${{ needs.plan.outputs.before_remaining }}
      ITERATION: ${{ inputs.iteration || '1' }}
      MAX_ITERATIONS: ${{ inputs.max_iterations || '20' }}
      SHARDS: ${{ inputs.shards || '8' }}
    steps:
      - name: Count remaining and decide
        run: |
          summary=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/headshot_coverage_summary" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "### Coverage after this pass (iteration $ITERATION)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          after=$(echo "$summary" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(sum(v.get('pending', 0) + v.get('error', 0) for v in data.values()))
          ")
          echo "Remaining unresolved (pending+error): $BEFORE -> $after" >> "$GITHUB_STEP_SUMMARY"

          if [ "$after" -eq 0 ]; then
            echo "Nothing left unresolved — coverage is as complete as this pipeline gets. Stopping." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ITERATION" -ge "$MAX_ITERATIONS" ]; then
            echo "Hit the $MAX_ITERATIONS-iteration safety cap with $after still unresolved. Stopping — the weekly schedule will pick this up again, or re-dispatch manually to keep going now." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$after" -lt "$BEFORE" ]; then
            next=$((ITERATION + 1))
            echo "Made progress ($BEFORE -> $after). Dispatching iteration $next." >> "$GITHUB_STEP_SUMMARY"
            gh workflow run headshot-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f shards="$SHARDS" -f iteration="$next" -f max_iterations="$MAX_ITERATIONS"
          else
            echo "No progress this pass ($BEFORE -> $after) — whatever's left needs a source this pipeline doesn't have (confirmed placeholder/missing/permanent error), not another pass. Stopping." >> "$GITHUB_STEP_SUMMARY"
          fi
